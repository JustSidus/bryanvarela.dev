<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Página no encontrada | Bryan Varela</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261020-blue" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, sans-serif;
        color: #20273b;
        background: #f8f9fd;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        min-height: 100dvh;
        display: grid;
        align-content: center;
        justify-items: start;
        max-width: 700px;
        margin: auto;
        padding: 32px;
      }
      .code {
        font-size: 72px;
        color: #3e50c6;
        font-weight: 700;
        margin: 0 0 20px;
      }
      h1 {
        font-size: 30px;
        letter-spacing: -1px;
      }
      p {
        color: #566078;
        line-height: 1.8;
      }
      a {
        display: inline-block;
        background: #3e50c6;
        color: #fff;
        padding: 14px 20px;
        text-decoration: none;
        border-radius: 4px;
        margin-top: 18px;
      }
      a:focus-visible {
        outline: 3px solid #aab9ff;
        outline-offset: 5px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #edf0fc;
          background: #141824;
        }
        p {
          color: #b7c0d7;
        }
        .code {
          color: #aab9ff;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Esta página no está disponible.</h1>
      <p>
        Puedes volver al portafolio para ver mis proyectos, experiencia y formas
        de contacto.
      </p>
      <a href="/">Volver al portafolio</a>
    </main>
  </body>
</html>
